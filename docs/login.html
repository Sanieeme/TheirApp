<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Bono Foundation</title>
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #121212;
            --bg-input: #1a1a1a;
            --gold-primary: #d4af37;
            --gold-hover: #f3cd57;
            --gold-muted: rgba(212, 175, 55, 0.15);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: rgba(212, 175, 55, 0.15);
            --danger: #f87171;
        }

        body {
            margin: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #111111 0%, var(--bg-main) 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* BACK TO MAIN SITE LINK */
        .back-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--gold-primary);
        }

        /* PREMIUM GLASS & GOLD CARD */
        .login-box {
            width: 360px;
            background: var(--bg-card);
            padding: 45px 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(212, 175, 55, 0.03);
        }

        /* BRANDING TYPOGRAPHY */
        .login-box h2 {
            text-align: center;
            color: var(--gold-primary);
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .login-box p {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin: 0 0 35px 0;
            letter-spacing: 0.5px;
        }

        /* LUXURY INPUT FIELDS */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px 16px;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
            background: #202020;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* LUXURY ACTION BUTTON */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--gold-primary);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: #000000;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        button:hover {
            background: var(--gold-hover);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        button:disabled {
            background: #333333;
            color: #777777;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* MINIMALIST SPINNER */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ALERTS */
        #error {
            color: var(--danger);
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            font-weight: 500;
            min-height: 18px;
        }

        /* COPYRIGHT MARK */
        .footer {
            text-align: center;
            margin-top: 35px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <!-- LINK TO RETURN TO HOME SITE -->
    <a href="index.html" class="back-link">← Back to Public Site</a>

    <div class="login-box">
        <h2>Bono Admin</h2>
        <p>Please log in to manage the system</p>

        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password">
        </div>

        <button id="btn" onclick="login()">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">Log In</span>
        </button>

        <div id="error"></div>

        <div class="footer">© 2026 Bono Foundation</div>
    </div>

    <script>
        async function login() {
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const btn = document.getElementById("btn");
            const spinner = document.getElementById("spinner");
            const btnText = document.getElementById("btnText");
            const error = document.getElementById("error");

            error.innerText = "";
            btn.disabled = true;
            spinner.style.display = "block";
            btnText.innerText = "Checking details...";

            try {
                const res = await fetch("http://127.0.0.1:8000/auth/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", data.access_token);
                    window.location.href = "admin.html";
                } else {
                    // Friendly error default message if the server error is missing
                    error.innerText = data.detail || "Incorrect username or password. Please try again.";
                }

            } catch (err) {
                error.innerText = "Could not connect to the server. Please check your internet connection.";
            }

            btn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "Log In";
        }
    </script>

</body>
</html>
