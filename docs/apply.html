<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply | Bono Foundation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #f5f5f5;
}

.navbar {
    background: #000;
    border-bottom: 2px solid #d4af37;
    padding: 1rem 2rem;
}

.navbar-brand {
    color: #d4af37 !important;
    font-weight: bold;
}

.section {
    padding: 4rem 1rem;
}

.form-container {
    background: #141414;
    padding: 2.5rem;
    border-radius: 15px;
    border: 1px solid rgba(212,175,55,0.4);
}

.form-title {
    text-align: center;
    color: #d4af37;
}

.form-subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

.form-label {
    color: #ddd;
}

.form-control,
.form-select,
textarea {
    background: #1e1e1e;
    border: 1px solid #333;
    color: #fff;
}

.form-control:focus,
.form-select:focus,
textarea:focus {
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
}

.btn-submit {
    background: #d4af37;
    color: #000;
    font-weight: bold;
}

.btn-submit:hover {
    background: #b8942e;
}
</style>

</head>

<body>

<nav class="navbar">
<div class="container-fluid">
<a class="navbar-brand" href="index.html">Bono Foundation</a>
</div>
</nav>

<section class="section">
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">

<div class="form-container">

<h2 class="form-title">Apply to Bono Foundation</h2>
<p class="form-subtitle">Take the first step towards your future</p>

<!-- ✅ FIXED FORM -->
<form id="applyForm">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Program</label>
<select name="program" class="form-select" required>
    <option value="">Select</option>
    <option value="mentor">Mentoring</option>
    <option value="tutor">Tutoring</option>
    <option value="career_guidance">Career Guidance</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Message</label>
<textarea name="message" rows="4" class="form-control" required></textarea>
</div>

<div class="d-grid mt-4">
<button type="submit" class="btn btn-submit">Submit Application</button>
</div>

</form>

</div>

</div>
</div>
</div>
</section>

<footer class="text-center text-light p-4 border-top border-warning">
<p>Bono Foundation © 2025</p>
</footer>

<!-- ✅ FIXED JS CONNECTION -->
<script>
document.getElementById("applyForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    const data = {
        name: formData.get("name"),
        email: formData.get("email"),
        program: formData.get("program"),
        message: formData.get("message")
    };

    try {
        const res = await fetch("http://127.0.0.1:8000/applications/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
            alert("✅ " + result.message);
            this.reset();
        } else {
            alert("❌ Error submitting application");
        }

    } catch (error) {
        alert("❌ Backend not reachable");
        console.error(error);
    }
});
</script>

</body>
</html>
